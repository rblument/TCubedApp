<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In - TCubed</title>
    <link rel="stylesheet" data-th-href="@{/css/style.css}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <h2>T³ Tracker</h2>
            <p>Sign in to your project workspace</p>
        </div>

        <div data-th-if="${param.registered}" class="alert alert-success">
            Account created successfully! Please log in.
        </div>

        <div data-th-if="${error}" class="alert alert-error" data-th-text="${error}"></div>

        <form action="/login" method="post" class="auth-form">
            <div class="form-group">
                <label for="username">User ID / Email</label>
                <input type="text" id="username" name="username" placeholder="test@regis.edu" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required />
            </div>

            <button type="submit" class="btn-primary">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a data-th-href="@{/register}">Create an Account</a>
        </div>
    </div>
</body>
</html>
